name: ci
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dev-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: ./scripts/ci-security.sh
      - run: python3 -B .github/scripts/check_dependencies.py
      - run: python3 -B -m unittest discover -s .github/scripts -p "test_dependencies.py"
  application:
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: npm install --global --ignore-scripts pnpm@12.15.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - run: pnpm typecheck
  pr-description:
    name: PR description
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - run: python3 -B .github/scripts/check_pr_description.py
  ci:
    name: CI
    if: always()
    needs: [security, application, pr-description]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require standard CI, security and PR description
        env:
          SECURITY: ${{ needs.security.result }}
          APPLICATION: ${{ needs.application.result }}
          DESCRIPTION: ${{ needs.pr-description.result }}
        run: |
          test "$SECURITY" = success
          test "$APPLICATION" = success
          test "$DESCRIPTION" = success
