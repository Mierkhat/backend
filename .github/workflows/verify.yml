name: Main verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: ./scripts/ci-security.sh
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p "test_compatibility.py"
      - run: python3 scripts/check-compatibility.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: npm install --global --ignore-scripts pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm typecheck:scripts
      - run: pnpm typecheck:api
      - run: pnpm --filter @mierkhat/sdk typecheck
      - run: pnpm --filter @mierkhat/sdk typecheck:scripts
      - run: pnpm --filter @mierkhat/sdk test
      - run: pnpm test:integration
      - run: pnpm --filter @mierkhat/sdk check:deployments
  ci:
    name: CI
    if: always()
    needs: [security, compatibility, application]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          SECURITY: ${{ needs.security.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          APPLICATION: ${{ needs.application.result }}
        run: |
          test "$SECURITY" = success
          test "$COMPATIBILITY" = success
          test "$APPLICATION" = success
