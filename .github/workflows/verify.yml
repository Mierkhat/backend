name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm typecheck:scripts
      - run: pnpm test
      - run: pnpm --filter @mierkhat/sdk typecheck
      - run: pnpm --filter @mierkhat/sdk typecheck:scripts
      - run: pnpm --filter @mierkhat/sdk test
      - run: pnpm test:integration
      - run: pnpm --filter @mierkhat/sdk check:deployments
